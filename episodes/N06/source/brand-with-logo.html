const scenes={
"intro":{"label":"N06 / 自然语言问数与业务语义","html":"<div class=\"content topic\"><div class=\"eyebrow\">企业知识系列 · 数据洞察</div><h1>自然语言问数<br><span class=\"gold\">为什么需要业务语义治理？</span></h1><p>从数据库字段到业务口径，弥合物理表与业务理解的差距。</p><div class=\"stamp\"><span>语义映射</span><span>口径对齐</span><span>数据主题</span></div></div>"},
"problem":{"label":"问题 / 一句话背后的复杂性","html":"<div class=\"content\"><div class=\"eyebrow\">看似简单的提问</div><h2>\"今年销售额多少？\"</h2><div class=\"pain-points\"><div class=\"card\"><h3>定义模糊</h3><p>含税还是不含税？订单金额还是实收金额？要不要扣除退货？</p></div><div class=\"card\"><h3>时间口径</h3><p>自然年还是财务年？包不包含未完成的订单？</p></div><div class=\"card\"><h3>数据来源</h3><p>订单表、发票表还是回款表？不同表结果可能差几倍。</p></div></div></div>"},
"gap":{"label":"差距 / 存储结构 ≠ 业务理解","html":"<div class=\"content\"><div class=\"eyebrow\">物理表与业务口径的差距</div><h2>数据库不是为业务理解设计的</h2><div class=\"solution-flow\"><div class=\"step\"><h3>业务语言</h3><p>\"本月活跃客户数\"</p></div><div class=\"arrow\">→</div><div class=\"step\"><h3>业务定义</h3><p>有下单且有回款的独立客户</p></div><div class=\"arrow\">→</div><div class=\"step\"><h3>数据查询</h3><p>关联订单表 + 回款表 + 客户表</p></div></div><div class=\"demo-notice\">没有语义定义时，同样的自然语言提问可能生成完全不同的查询。</div></div>"},
"solution":{"label":"方案 / 数据主题翻译层","html":"<div class=\"content\"><div class=\"eyebrow\">业务语义治理的作用</div><h2>数据主题：物理表与业务理解之间的翻译层</h2><div class=\"solution-flow\"><div class=\"step\"><h3>业务概念</h3><p>销售额、活跃客户<br>批次异常</p></div><div class=\"arrow\">→</div><div class=\"step\"><h3>语义定义</h3><p>映射规则<br>计算逻辑</p></div><div class=\"arrow\">→</div><div class=\"step\"><h3>数据查询</h3><p>自动选表、过滤<br>聚合计算</p></div></div><div class=\"demo-notice\">有了语义定义，系统知道查哪张表、用哪个字段、怎么过滤和聚合。</div></div>"},
"when":{"label":"判断 / 何时需要语义治理","html":"<div class=\"content\"><div class=\"eyebrow\">什么时候需要业务语义治理</div><h2>判断标准</h2><div class=\"criteria\"><div class=\"card\"><h3>需要语义治理</h3><p>业务指标有明确定义，不同部门需要对齐口径<br>一个问题需要关联多张表<br>非技术用户用自然语言提问</p></div><div class=\"card\"><h3>直接查库即可</h3><p>查某张表有多少行<br>某个字段的值是什么<br>简单筛选和排序</p></div></div><div class=\"demo-notice\">当\"问题\"和\"数据库能回答的\"之间有翻译成本时，就需要语义治理。</div></div>"},
"outro":{"label":"企业知识系列","html":"<div class=\"content ending\"><div class=\"eyebrow\">问学知识平台</div><h1>业务语义治理<br><span class=\"gold\">让问数的答案和业务理解一致。</span></h1><div class=\"underline\"></div><p>弥合物理表和业务理解之间的差距。</p><div class=\"next\"><span>继续学习 →</span> 探索更多知识能力</div></div>"}
};

</style><main><header><div class="brand"><svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="100" rx="15" fill="#f2c34e"/><text x="50" y="68" font-size="50" font-weight="bold" fill="#09111f" text-anchor="middle" font-family="Arial">K</text></svg><span>问学知识平台</span><b>K-BOX</b></div><div class="section" id="section"></div></header><div id="stage"></div></main><script>
const scenes={
"intro":{"label":"N07 / API、MCP、Skill 接入路径","html":"<div class=\"content topic\"><div class=\"eyebrow\">企业知识系列 · 开发集成</div><h1>API、MCP、Skill<br><span class=\"gold\">怎样选择接入路径？</span></h1><p>把 K-BOX 的知识能力接入到外部系统，从三种方式中选对入口。</p><div class=\"stamp\"><span>Open API</span><span>MCP 协议</span><span>Skill 能力包</span></div></div>"},
"why":{"label":"场景 / 为什么要外部接入","html":"<div class=\"content\"><div class=\"eyebrow\">从平台内到业务系统</div><h2>K-BOX 的能力不止在平台内使用</h2><div class=\"reasons\"><div class=\"card\"><h3>业务系统对接</h3><p>自研 CRM、ERP 在客户详情页展示相关知识</p></div><div class=\"card\"><h3>智能客服</h3><p>客服机器人调用企业知识库回答售后问题</p></div><div class=\"card\"><h3>内部 Agent</h3><p>智能体检索合同条款辅助审批决策</p></div></div><div class=\"demo-box\">平台提供三种接入方式：Open API、MCP 协议、Skill</div></div>"},
"api":{"label":"方式一 / Open API","html":"<div class=\"content\"><div class=\"eyebrow\">程序化精确调用</div><h2>Open API：标准 HTTP 接口</h2><div class=\"method-card\"><div class=\"subtitle\">调用方精确控制参数，平台负责检索和返回</div><p>把检索、问答、文件管理等能力封装成标准 HTTP 接口，外部系统通过 API Key 调用。</p><ul><li>可指定查哪个库、过滤什么标签、返回多少片段</li><li>适合自研 CRM、ERP、工单系统等程序化集成</li><li>如何使用返回结果由调用方决定</li></ul><p><span class=\"gold\">调用流程：</span>获取 Token → 发起检索 → 解析结果 → 业务逻辑使用</p></div></div>"},
"mcp":{"label":"方式二 / MCP 协议","html":"<div class=\"content\"><div class=\"eyebrow\">专为 AI Agent 设计</div><h2>MCP：让 Agent 自动发现和调用</h2><div class=\"method-card\"><div class=\"subtitle\">Agent 自主判断是否需要调用、调用什么</div><p>MCP 是一种专为 AI Agent 设计的协议，Claude Desktop、Cursor、自建 Agent 框架都支持。</p><ul><li>Agent 根据用户提问，自动判断是否调用 K-BOX</li><li>不需要预先写死调用逻辑</li><li>适合对话式场景和多工具组合</li></ul><p><span class=\"gold\">区别：</span>Open API 是\"我告诉系统怎么查\"，MCP 是\"Agent 自己决定要不要查\"</p></div></div>"},
"skill":{"label":"方式三 / Skill","html":"<div class=\"content\"><div class=\"eyebrow\">封装与复用</div><h2>Skill：打包成可复用的能力单元</h2><div class=\"method-card\"><div class=\"subtitle\">一次配置、多处使用、版本管理</div><p>把一组知识资源和调用规则打包成能力单元，可被内部或外部智能体使用。</p><ul><li>绑定知识库、Wiki 库、图谱库，配置调用范围和权限</li><li>可导出给外部 Agent，也可平台内部共享</li><li>适合把某类业务知识服务标准化输出</li></ul><p><span class=\"gold\">价值：</span>封装复用，版本维护，标准化输出给多个调用方</p></div></div>"},
"compare":{"label":"对比 / 怎么选","html":"<div class=\"content\"><div class=\"eyebrow\">三种方式对照</div><h2>根据调用方、使用方式、运行条件选择</h2><div class=\"compare-table\"><div class=\"row header\"><div class=\"header\">维度</div><div class=\"header\">Open API</div><div class=\"header\">MCP</div><div class=\"header\">Skill</div></div><div class=\"row\"><div class=\"label\">适合</div><div class=\"cell\">程序化集成</div><div class=\"cell\">AI Agent 集成</div><div class=\"cell\">能力封装复用</div></div><div class=\"row\"><div class=\"label\">控制</div><div class=\"cell\">调用方精确控制</div><div class=\"cell\">Agent 自主决定</div><div class=\"cell\">配置一次多处生效</div></div><div class=\"row\"><div class=\"label\">典型</div><div class=\"cell\">业务系统、数据同步</div><div class=\"cell\">对话场景、多工具组合</div><div class=\"cell\">多调用方共享知识服务</div></div></div><div class=\"demo-box\">自研系统用 API；已有 Agent 框架用 MCP；标准化输出做 Skill</div></div>"},
"demo":{"label":"演示 / 三种界面一览","html":"<div class=\"content\"><div class=\"eyebrow\">实际界面</div><h2>三种接入方式的入口</h2><div class=\"three\"><div class=\"card\"><h3>Skill 中心</h3><p>已创建的能力包<br>绑定知识库<br>版本管理<br>导出给外部</p></div><div class=\"card\"><h3>MCP 服务</h3><p>配置服务地址<br>外部 Agent 自动发现可用工具<br>支持多协议</p></div><div class=\"card\"><h3>Open API</h3><p>调试界面<br>发送检索请求<br>命中片段<br>相关度分数<br>原文链接</p></div></div></div>"},
"outro":{"label":"企业知识系列","html":"<div class=\"content ending\"><div class=\"eyebrow\">问学知识平台</div><h1>选择对的方式<br><span class=\"gold\">让知识流入业务系统。</span></h1><div class=\"underline\"></div><p>API 精确、MCP 自主、Skill 复用。</p><div class=\"next\"><span>继续学习 →</span> 探索更多知识能力</div></div>"}
};

</script></html>

const scenes={
"intro":{"label":"N03 / 四种知识能力","html":"<div class=\"content topic\"><div class=\"eyebrow\">企业知识系列 · 能力选型</div><h1>四种知识能力<br><span class=\"gold\">怎么选？</span></h1><p>从业务问题出发，选择合适的知识形态。</p><div class=\"stamp\"><span>文档知识库</span><span>企业 Wiki</span></div><div class=\"stamp\"><span>知识图谱</span><span>数据洞察</span></div></div>"},
"overview":{"label":"总览 / 四类核心知识资产","html":"<div class=\"content\"><div class=\"eyebrow\">从问题出发，选择知识形态</div><h2>四类知识资产，解决不同业务问题</h2><div class=\"four\"><div class=\"card\"><em>01 / 原文检索</em><h3>文档知识库</h3><p>答案必须能回到原文核验<br>有据可查</p></div><div class=\"card\"><em>02 / 主题沉淀</em><h3>企业 Wiki</h3><p>把分散资料变成可阅读<br>可追溯的知识入口</p></div><div class=\"card\"><em>03 / 关系探索</em><h3>知识图谱</h3><p>回答谁和谁有什么关系<br>这类结构化问题</p></div><div class=\"card\"><em>04 / 自然语言问数</em><h3>数据洞察</h3><p>让不懂 SQL 的用户<br>也能安全查询业务数据</p></div></div><div class=\"takeaway\">选择哪条路径，关键看两个问题：你要解决什么业务问题？你需要沉淀什么形态的知识？</div></div>"},
"document-intro":{"label":"01 / 文档知识库","html":"<div class=\"content chapter-intro\"><div class=\"eyebrow\">第一种知识能力</div><h1>文档知识库</h1><div class=\"desc\">适合员工需要快速查阅制度、手册、规范等原文资料的场景。<br>平台完成文档解析、切片和向量化，用户可以通过语义检索找到相关片段，并通过智能问答获得带引用的回答。</div><div class=\"highlight\"><strong class=\"gold\">核心价值：</strong>答案必须能回到原文核验，有据可查。<br><br><strong class=\"gold\">典型场景：</strong>供应商来料不良导致的质量问题如何处置？</div></div>"},
"wiki-intro":{"label":"02 / 企业 Wiki","html":"<div class=\"content chapter-intro\"><div class=\"eyebrow\">第二种知识能力</div><h1>企业 Wiki</h1><div class=\"desc\">适合资料分散、重复，需要整理成稳定主题页的场景。<br>平台自动抽取多份文档中的相关内容，生成带来源引用的主题页面，员工可以阅读、检索和追问。</div><div class=\"highlight\"><strong class=\"gold\">核心价值：</strong>把分散资料变成可阅读、可追溯的知识入口。<br><br><strong class=\"gold\">典型场景：</strong>从多份文档中自动生成主题页面，如中国电影知识库的 557 个实体页面。</div></div>"},
"graph-intro":{"label":"03 / 知识图谱","html":"<div class=\"content chapter-intro\"><div class=\"eyebrow\">第三种知识能力</div><h1>知识图谱</h1><div class=\"desc\">适合需要追问实体关系、路径和影响的场景。<br>平台从文档中抽取人物、产品、系统等实体及其关系，支持关系查询和多跳探索。</div><div class=\"highlight\"><strong class=\"gold\">核心价值：</strong>回答「谁和谁有什么关系」这类结构化问题。<br><br><strong class=\"gold\">典型场景：</strong>陈凯歌导演了哪些电影？《长津湖》的主演还演过什么？</div></div>"},
"insight-intro":{"label":"04 / 数据洞察","html":"<div class=\"content chapter-intro\"><div class=\"eyebrow\">第四种知识能力</div><h1>数据洞察</h1><div class=\"desc\">适合用户需要用自然语言查询业务数据的场景。<br>平台结合数据库结构、业务概念和指标口径，把自然语言问题转化为可执行的查询语句。</div><div class=\"highlight\"><strong class=\"gold\">核心价值：</strong>让不懂 SQL 的用户也能安全、准确地查询业务数据。<br><br><strong class=\"gold\">典型场景：</strong>本月有多少未关闭工单？VIP 客户的故障率是多少？</div></div>"},
"comparison":{"label":"选型 / 从问题到路径","html":"<div class=\"content\"><div class=\"eyebrow\">怎样选择起点</div><h2>一个简单的判断框架</h2><div class=\"four\"><div class=\"card focus\"><em>查原文、找依据</em><h3>文档知识库</h3><p>员工查阅制度、手册、规范<br>答案追溯到原文条款</p></div><div class=\"card\"><em>汇总知识、沉淀主题</em><h3>企业 Wiki</h3><p>资料分散、重复<br>整理成稳定主题页</p></div><div class=\"card\"><em>追问关系、探索路径</em><h3>知识图谱</h3><p>实体关系查询<br>多跳探索</p></div><div class=\"card\"><em>查数据、看指标</em><h3>数据洞察</h3><p>自然语言查询<br>业务数据</p></div></div><div class=\"takeaway\">实际业务中，可以组合多条路径：先用文档验证知识，再用 Wiki 沉淀主题，必要时接入图谱或数据洞察。</div></div>"},
"outro":{"label":"企业知识系列","html":"<div class=\"content ending\"><div class=\"eyebrow\">问学知识平台</div><h1>从业务问题出发，<br><span class=\"gold\">选择合适的知识形态。</span></h1><div class=\"underline\"></div><p>让企业资料成为可信的业务上下文。</p><div class=\"next\"><span>继续学习 →</span> 从知识治理到业务应用</div></div>"}
};

</script></html>

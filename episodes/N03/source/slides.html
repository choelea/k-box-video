const scenes={"intro":{"label":"N03 / 四种知识能力","html":"<div class=\"content topic\"><div class=\"eyebrow\">企业知识系列 · 能力选型</div><h1>四种知识能力<br><span class=\"gold\">怎么选？</span></h1><p>从业务问题出发，选择合适的知识形态。</p><div class=\"stamp\"><span>文档知识库</span><span>企业 Wiki</span></div><div class=\"stamp\"><span>知识图谱</span><span>数据洞察</span></div></div>"},"overview":{"label":"总览 / 四类核心知识资产","html":"<div class=\"content\"><div class=\"eyebrow\">从问题出发，选择知识形态</div><h2>四类知识资产，解决不同业务问题</h2><div class=\"four\"><div class=\"card\"><em>01 / 原文检索</em><h3>文档知识库</h3><p>答案必须能回到原文核验<br>有据可查</p></div><div class=\"card\"><em>02 / 主题沉淀</em><h3>企业 Wiki</h3><p>把分散资料变成可阅读<br>可追溯的知识入口</p></div><div class=\"card\"><em>03 / 关系探索</em><h3>知识图谱</h3><p>回答谁和谁有什么关系<br>这类结构化问题</p></div><div class=\"card\"><em>04 / 自然语言问数</em><h3>数据洞察</h3><p>让不懂 SQL 的用户<br>也能安全查询业务数据</p></div></div><div class=\"takeaway\">选择哪条路径，关键看两个问题：你要解决什么业务问题？你需要沉淀什么形态的知识？</div></div>"},"comparison":{"label":"选型 / 从问题到路径","html":"<div class=\"content\"><div class=\"eyebrow\">怎样选择起点</div><h2>一个简单的判断框架</h2><div class=\"four\"><div class=\"card focus\"><em>查原文、找依据</em><h3>文档知识库</h3><p>员工查阅制度、手册、规范<br>答案追溯到原文条款</p></div><div class=\"card\"><em>汇总知识、沉淀主题</em><h3>企业 Wiki</h3><p>资料分散、重复<br>整理成稳定主题页</p></div><div class=\"card\"><em>追问关系、探索路径</em><h3>知识图谱</h3><p>实体关系查询<br>多跳探索</p></div><div class=\"card\"><em>查数据、看指标</em><h3>数据洞察</h3><p>自然语言查询<br>业务数据</p></div></div><div class=\"takeaway\">实际业务中，可以组合多条路径：先用文档验证知识，再用 Wiki 沉淀主题，必要时接入图谱或数据洞察。</div></div>"},"outro":{"label":"企业知识系列","html":"<div class=\"content ending\"><div class=\"eyebrow\">问学知识平台</div><h1>从业务问题出发，<br><span class=\"gold\">选择合适的知识形态。</span></h1><div class=\"underline\"></div><p>让企业资料成为可信的业务上下文。</p><div class=\"next\"><span>继续学习 →</span> 从知识治理到业务应用</div></div>"}};

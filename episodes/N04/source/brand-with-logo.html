"problem":{"label":"痛点 / 资料分散","html":"<div class=\"content\"><div class=\"eyebrow\">企业知识管理的常见困境</div><h2>资料分散，知识难沉淀</h2><div class=\"pain-points\"><div class=\"card\"><h3>散落多处</h3><p>知识分散在文档、表格、邮件和个人笔记中</p></div><div class=\"card\"><h3>难以拼凑</h3><p>同一主题需要翻看好几份资料才能完整了解</p></div><div class=\"card\"><h3>查找困难</h3><p>资料越来越多，找到需要的内容变得更难</p></div></div></div>"},

"value":{"label":"价值 / 适用场景","html":"<div class=\"content\"><div class=\"eyebrow\">什么时候需要企业 Wiki</div><h2>适用场景</h2><div class=\"four\"><div class=\"card\"><em>场景一</em><h3>资料分散重复</h3><p>同一主题散落在多份文档中，需要整理聚合</p></div><div class=\"card\"><em>场景二</em><h3>需要稳定入口</h3><p>同一主题被反复查询，需要可浏览的主题页</p></div><div class=\"card\"><em>场景三</em><h3>知识长期维护</h3><p>知识需要持续更新，保持时效性和一致性</p></div><div class=\"card\"><em>场景四</em><h3>跨文档整合</h3><p>需要从多处资料综合信息，形成完整认知</p></div></div></div>"},

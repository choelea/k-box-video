<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#edf2fb;font-family:'PingFang SC',sans-serif;overflow:hidden}main{width:1760px;height:880px;padding:100px 100px;position:relative;background:radial-gradient(ellipse at 90% 0%,#263b5b77,transparent 60%),radial-gradient(ellipse at 10% 90%,#75551e22,transparent 45%),#0b1120}.eyebrow{color:#efc557;font-size:21px;letter-spacing:4px;margin-bottom:30px}h1{font-size:76px;line-height:1.35;margin:0 0 25px;letter-spacing:1px}h2{font-size:48px;margin:0 0 20px}em{color:#f4c34e;font-style:normal}p{font-size:27px;line-height:1.75;color:#aab9d0;margin:0} .grid{display:flex;gap:26px;margin-top:55px}.card{flex:1;padding:35px 32px;background:#162238;border:1px solid #30425d;border-radius:18px;transition:.5s}.card strong{font-size:28px;display:block;margin:20px 0 16px;color:#fff}.card p{font-size:23px}.num{font-size:22px;color:#efc557;letter-spacing:2px}.chips{display:flex;gap:18px;margin-top:42px}.chip{font-size:23px;padding:15px 25px;border:1px solid #33435d;border-radius:8px;color:#d8e2f2}.active{border-color:#efc557!important;background:#283044!important;box-shadow:0 0 35px #efc55712}.four{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px}.four .card{padding:26px 32px}.four strong{margin:8px 0;font-size:29px}.four p{font-size:23px}.line{position:absolute;width:90px;height:4px;background:#f4c34e;top:65px}.arrow{font-size:35px;color:#efc557;align-self:center}.flow .card{padding:30px 28px}.flow .card strong{font-size:30px}.note{margin-top:36px;font-size:23px;color:#8fa4c1}.wide{max-width:1250px}.small{font-size:24px} .verdict{display:grid;grid-template-columns:1fr 1.25fr;gap:35px;margin-top:50px}.verdict .card{padding:36px}.verdict h3{font-size:29px;margin:0 0 20px}.verdict p{font-size:25px}.foot{position:absolute;bottom:55px;color:#8092ad;font-size:20px}.quote{font-size:31px;color:#dbe5f5;margin-top:45px;padding-left:25px;border-left:4px solid #efc557}
</style><main id="main"></main><script>
const slides={
intro:`<div class="line"></div><div class="eyebrow">K-BOX · 认知与选型 N02</div><h1>已有文档系统和大模型<br>为什么还需要 <em>K-BOX？</em></h1><p>从一次真实问答，看企业知识如何进入业务</p><div class="chips"><span class="chip">知识处理</span><span class="chip">可控供给</span><span class="chip">证据核对</span></div><div class="foot">问学知识平台 · 基于演示环境实录</div>`,
roles:`<div class="eyebrow">各自承担什么工作</div><h2>从内容，到知识，再到回答</h2><p>围绕一条完整链路，评估现有能力与实际缺口</p><div class="grid"><div class="card" id="r0"><div class="num">01 / 内容来源</div><strong>文档系统</strong><p>保存资料<br>组织目录<br>协同编辑</p></div><div class="card" id="r2"><div class="num">02 / 知识供给</div><strong>K-BOX</strong><p>处理与检索<br>范围与权限<br>来源与证据</p></div><div class="card" id="r1"><div class="num">03 / 理解与生成</div><strong>大模型 / Agent</strong><p>理解问题<br>组织语言<br>比较与推理</p></div></div>`,
criteria:`<div class="eyebrow">持续服务需要回答的问题</div><h2>知识可用，需要把四件事说清楚</h2><div class="four"><div class="card" id="c0"><div class="num">01 / 来源</div><strong>资料从哪里来？</strong><p>接入什么资料，如何持续维护</p></div><div class="card" id="c1"><div class="num">02 / 范围</div><strong>哪些内容参与回答？</strong><p>文档是否可用，适用时间和范围是什么</p></div><div class="card" id="c2"><div class="num">03 / 权限</div><strong>当前用户可以看什么？</strong><p>按使用者身份验证访问边界</p></div><div class="card" id="c3"><div class="num">04 / 证据</div><strong>答案依据在哪里？</strong><p>沿引用核对原文是否支持结论</p></div></div><div class="note">已有系统也可能具备这些能力 · 选型应以实际缺口与维护成本为依据</div>`,
architecture:`<div class="eyebrow">放回企业整体架构</div><h2>让维护好的知识，服务多个业务入口</h2><div class="grid flow"><div class="card" id="a0"><div class="num">企业内容</div><strong>现有内容系统</strong><p>制度文档<br>产品资料<br>操作手册</p></div><div class="arrow">→</div><div class="card active" id="a1"><div class="num">知识处理与供给</div><strong>K-BOX 问学</strong><p>解析 · 组织 · 治理<br>检索 · 权限 · 溯源<br>接口与应用集成</p></div><div class="arrow">→</div><div class="card" id="a2"><div class="num">知识消费</div><strong>智能体与业务应用</strong><p>问答与检索<br>业务助手<br>大模型理解与生成</p></div></div><div class="quote" id="limit">新旧冲突，要核对时间与适用范围；权限边界，要按实际身份验证。</div>`,
decision:`<div class="eyebrow">选型判断</div><h2>什么时候值得引入 <em>K-BOX？</em></h2><div class="verdict"><div class="card" id="d0"><h3>偶尔阅读几份材料</h3><p>现有文档与模型工具<br>可能已经足够</p></div><div class="card" id="d1"><h3>知识需要持续服务业务</h3><p>持续更新 · 多应用复用<br>按身份控制访问 · 答案依据可核查</p><p style="color:#efc557;margin-top:20px">值得评估知识平台的建设与维护价值</p></div></div><div class="quote">后续任务实操：资料 → 可用的知识服务 → 效果验证</div><div class="foot">本集实录：已有文档 → 检索问答 → 引用核对</div>`};
function show(){main.innerHTML=slides[location.hash.slice(1)]||slides.intro;main.animate([{opacity:.2,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:450,fill:'forwards'})}onhashchange=show;show();window.highlight=id=>{document.querySelectorAll('.active').forEach(x=>x.classList.remove('active'));document.getElementById(id)?.classList.add('active')}
</script></html>
